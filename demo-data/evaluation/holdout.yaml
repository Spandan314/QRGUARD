    label: scam
    text: "Invest Rs 10,000 today and get guaranteed Rs 50,000 in 7 days. 100% safe crypto trading, limited slots. WhatsApp now."
  - id: m-sim-block
    label: scam
    text: "Your SIM card will be blocked within 2 hours due to KYC expiry. Call our customer care 98765 12345 and share the OTP you receive to continue service."
  - id: m-job-offer-fee
    label: scam
    text: "You are selected for Amazon data entry job, salary 35000/month. Pay Rs 2,500 security deposit for your ID card and training kit to confirm joining."
  - id: m-gift-card-boss
    label: scam
    text: "Hi, this is your manager. I am in a meeting and need you to buy 5 Google Play gift cards of Rs 2000 urgently. Send me the codes, I will pay you back."
  - id: m-rewards-points
    label: scam
    text: "Dear SBI user, your 7,250 reward points expire today. Redeem now at http://sbi-rewardz.example/redeem and enter your card details."

