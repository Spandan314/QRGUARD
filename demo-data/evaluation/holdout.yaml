# DEMO / TEST DATA: held-out evaluation set. Written after the scoring rules were frozen and NEVER
# used to tune them; do not change rules or weights to fit this file (add new cases instead).
# No real people's data: phone numbers are fictitious, links use reserved (.example, .test) or
# clearly fake domains. Do NOT send these to anyone.
#
# label: scam | genuine. The target is: every scam at least SUSPICIOUS, no genuine item MALICIOUS.
# Run: cd backend && python -m scripts.evaluate

messages:
