  - id: m-electricity-cutoff
    label: scam
    text: "Dear consumer your electricity power will be disconnected tonight at 9.30 pm because your previous month bill was not updated. Please immediately contact our electricity officer 98765 43210."
  - id: m-parcel-customs
    label: scam
    text: "Your courier parcel is held at customs. Pay Rs 49 clearance fee within 24 hours or it will be returned: http://indiapost-redelivery.top/pay"
