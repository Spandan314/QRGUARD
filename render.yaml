# Render Blueprint for the QRGUARD backend (https://render.com/docs/blueprint-spec).
# Only variable NAMES and non-secret defaults live here. Every secret is marked `sync: false`, so
# Render asks for it in the dashboard and it is never stored in the repository.
# See docs/deployment.md for the full procedure.
services:
  - type: web
    name: qrguard-api
    runtime: docker
    # Paths are relative to the repository root.
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # Only backend changes trigger a new build (when auto-deploy is turned on).
    buildFilter:
      paths:
        - backend/**
    plan: free
    region: singapore
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      # Your Vercel URL(s), comma-separated, e.g. https://qrguard.vercel.app. Never "*".
      - key: ALLOWED_ORIGINS
        sync: false
      # Render puts exactly one proxy in front of the app.
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: GUNICORN_THREADS
        value: "4"
      - key: REDIRECT_RESOLUTION
        value: shorteners_only
      - key: THREAT_INTEL_LOCAL_FEEDS_ENABLED
        value: "true"
      # Firebase (sign-in + history). Upload the service-account JSON as a Render *Secret File*
      # named firebase-service-account.json; Render mounts it at /etc/secrets/.
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CREDENTIALS_FILE
        value: /etc/secrets/firebase-service-account.json
      - key: HISTORY_RETENTION_DAYS
        value: "90"
      # Optional threat-intelligence keys: leave empty to keep a provider disabled.
      - key: URLHAUS_AUTH_KEY
        sync: false
      - key: GOOGLE_SAFE_BROWSING_API_KEY
        sync: false
      - key: VIRUSTOTAL_API_KEY
        sync: false
      - key: PHISHTANK_API_KEY
        sync: false
