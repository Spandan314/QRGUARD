# Render Blueprint for the QRGUARD backend (https://render.com/docs/blueprint-spec).
# Only variable NAMES and non-secret defaults live here. Every secret is marked `sync: false`, so
# Render asks for it in the dashboard and it is never stored in the repository.
# See docs/deployment.md for the full procedure.
services:
  - type: web
    name: qrguard-api
    runtime: docker
    # Paths are relative to the repository root.
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # Only backend changes trigger a new build (when auto-deploy is turned on).
    buildFilter:
      paths:
        - backend/**
    plan: free
    region: singapore
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      # Your Vercel URL(s), comma-separated exact origins, e.g. https://qrguard.vercel.app.
      # Never "*" or a pattern such as https://*.vercel.app (refused at startup).
      - key: ALLOWED_ORIGINS
        sync: false
      # Render puts exactly one proxy in front of the app.
      - key: TRUST_PROXY_HOPS
        value: "1"
      # One worker on the free plan: each Python worker needs about 95 MB before any request, and
      # screenshot checks (OpenCV + Tesseract) add up to about 125 MB more while they run. Two
      # workers came close to the 512 MB limit with a few uploads at once, and a worker killed for
      # memory cuts uploads off mid-request. Four threads still serve several users at a time.
      - key: WEB_CONCURRENCY
        value: "1"
      - key: GUNICORN_THREADS
        value: "4"
      # A slow free CPU can take longer than Gunicorn's default 60 s to answer a screenshot check;
      # the worker would then be killed mid-request.
      - key: GUNICORN_TIMEOUT
        value: "120"
      # Follow redirects of known link shorteners only (SSRF-hardened resolver:
      # backend/app/analyzers/redirect_resolver.py). Do NOT switch to "all" without a new
      # security review: "all" lets anyone make the backend contact a server of their choice for
      # every analysed link (see docs/security.md). "off" never contacts any link.
      - key: REDIRECT_RESOLUTION
        value: shorteners_only
      - key: THREAT_INTEL_LOCAL_FEEDS_ENABLED
        value: "true"
      # VirusTotal lookups per minute per worker process. The free public API allows about 4/min
      # per key, so keep VIRUSTOTAL_MAX_PER_MINUTE x WEB_CONCURRENCY <= 4 (and divide again if
      # you ever run more than one instance: processes do not coordinate with each other).
      - key: VIRUSTOTAL_MAX_PER_MINUTE
        value: "2"
      # PhishTank without an API key (PhishTank no longer issues new keys). Set to "true" in the
      # Render dashboard to enable it; it has a lower rate limit. Ignored if PHISHTANK_API_KEY is set.
      - key: PHISHTANK_ANONYMOUS
        value: "false"
      # Firebase (sign-in + history). Upload the service-account JSON as a Render *Secret File*
      # named firebase-service-account.json; Render mounts it at /etc/secrets/.
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CREDENTIALS_FILE
        value: /etc/secrets/firebase-service-account.json
      - key: HISTORY_RETENTION_DAYS
        value: "90"
      # Optional threat-intelligence keys: leave empty to keep a provider disabled.
      - key: URLHAUS_AUTH_KEY
        sync: false
      - key: GOOGLE_SAFE_BROWSING_API_KEY
        sync: false
      - key: VIRUSTOTAL_API_KEY
        sync: false
      - key: PHISHTANK_API_KEY
        sync: false
