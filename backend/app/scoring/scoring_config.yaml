# QRGUARD scoring configuration: the ONE place for risk weights, caps, floors and thresholds.
#
# Change values here, not in Python code. The file is validated at startup; an invalid file
# stops the server with a clear error instead of silently producing wrong scores.
#
# How a score is built (details: docs/risk-scoring.md):
#   1. Analyzers emit indicator IDs (they know nothing about points).
#   2. Each indicator adds its `weight` to its module; each category inside a module is capped.
#   3. Module scores (0-100) are combined with `module_weights`, averaged ONLY over modules
#      that apply to this input.
#   4. A `floor` on a critical indicator guarantees a minimum final score.
#   5. The final score is mapped to a level with `thresholds` (score only).
#   6. `verification` is reported separately and NEVER changes the score or level.

version: 2

# Score bands (the ONLY input to risk_level).
# SAFE means "no significant suspicious indicators detected", not "guaranteed safe".
thresholds:
  suspicious: 30   # score >= 30 -> SUSPICIOUS
  malicious: 60    # score >= 60 -> MALICIOUS

# Relative importance of each analysis module. Must add up to 1.0.
module_weights:
  url_qr: 0.35
  threat_intel: 0.30
  message: 0.20
  ocr: 0.15

# Maximum points per category inside a module, so one kind of evidence cannot dominate.
category_caps:
  url_structure: 45
  lexical: 15
  brand: 40
  redirect: 40
  trust: 100
  reputation: 100
  # scam-message groups
  pressure: 20
  credential: 40
  financial: 30
  pretext: 20
  lure: 25
  impersonation: 20
  contact: 10
  link: 10
  style: 10
  combination: 40
  ocr_quality: 0      # OCR indicators are informational only: OCR never adds risk points
  qr_payload: 40

# Severity shown to users is derived from the weight (a floor always means "critical").
severity_bands:   # minimum weight for each severity; weight <= 0 is "info"
  low: 1
  medium: 10
  high: 20
  critical: 40

# Verification: is there supporting evidence from a trusted source? Reported next to the
# risk level; it does not change the score. "Not found in a threat database" never verifies.
#   VERIFIED / threat_intelligence : a provider lists the input as malicious
#   VERIFIED / trusted_domain_list : destination on the curated trusted list and no finding
#                                    of `trusted_blocked_by_severity` or worse
#   UNVERIFIED / null              : insufficient evidence to establish trust
verification:
  threat_intel_indicator: TI_LISTED
  trusted_domain_indicator: TRUSTED_DOMAIN
  trusted_blocked_by_severity: medium

# Labels for scam categories (multi-label). Categories EXPLAIN a result; they never add points.
scam_categories:
  phishing: Phishing
  otp_scam: OTP scam
  banking_payment: Banking / payment scam
  upi_scam: UPI scam
  kyc_account_suspension: KYC / account suspension scam
  lottery_prize: Lottery / prize scam
  fake_job: Fake job scam
  fake_internship: Fake internship scam
  investment: Investment / financial scam
  impersonation: Impersonation scam
  fake_customer_support: Fake customer support scam
  credential_theft: Credential theft
  malicious_url: Malicious / suspicious URL
  social_engineering_other: Other social-engineering scam

# ---------------------------------------------------------------------------------------------
# Indicator catalogue. Every indicator an analyzer can emit MUST be listed here.
#   module:          which analysis module it belongs to
#   category:        category for capping (see category_caps)
#   weight:          points added (negative = evidence of legitimacy)
#   floor:           optional minimum final score when this indicator is present
#   scam_categories: optional labels reported when the result is SUSPICIOUS/MALICIOUS
#   title / message: plain-language text shown to users
# ---------------------------------------------------------------------------------------------
indicators:
  # ---- URL structure ------------------------------------------------------------------------
  URL_DANGEROUS_SCHEME:
    module: url_qr
    category: url_structure
    weight: 60
    floor: 80
    scam_categories: [malicious_url]
    title: Link can run code or open apps
    message: This is not a normal web link. Links starting with "javascript:", "data:" or "intent:" can run code or open apps on your device.
  URL_SCHEME_ASSUMED:
    module: url_qr
    category: url_structure
    weight: 0
    title: No http:// or https:// given
    message: The link had no protocol, so it was analysed as an https:// address.
  URL_IP_HOST:
    module: url_qr
    category: url_structure
    weight: 25
    scam_categories: [malicious_url]
    title: Uses an IP address instead of a domain name
    message: The URL uses an IP address instead of a normal domain name. Genuine organisations almost always use a named domain.
  URL_OBFUSCATED_IP:
    module: url_qr
    category: url_structure
    weight: 15
    scam_categories: [malicious_url]
    title: IP address written in a disguised form
    message: The address is written as a number in an unusual format (for example hexadecimal), a trick used to hide where the link really goes.
  URL_PRIVATE_NETWORK_HOST:
    module: url_qr
    category: url_structure
    weight: 15
    title: Points to a local or private network address
    message: This link points to a device on a private or local network (such as a router), not a public website. It was not contacted.
  URL_USERINFO_AT:
    module: url_qr
    category: url_structure
    weight: 20
    scam_categories: [phishing]
    title: Contains an "@" before the real address
    message: Everything before "@" in a web address is ignored by the browser. Scammers put a trusted name there to hide the real destination after the "@".
  URL_NO_HTTPS:
    module: url_qr
    category: url_structure
    weight: 8
    title: Does not use HTTPS
    message: The link uses http:// instead of https://, so anything you type on the page is not encrypted.
  URL_NONSTANDARD_PORT:
    module: url_qr
    category: url_structure
    weight: 10
    title: Uses an unusual port number
    message: The address includes an unusual port number (like ":8080"), which is uncommon for genuine public websites.
  URL_MANY_SUBDOMAINS:
    module: url_qr
    category: url_structure
    weight: 10
    scam_categories: [phishing]
    title: Many subdomains
    message: The address has an unusually long chain of sub-parts before the real domain, often used to make a fake site look official.
  URL_LONG:
    module: url_qr
    category: url_structure
    weight: 5
    title: Long URL
    message: The link is longer than usual, which can be used to hide the real address.
  URL_VERY_LONG:
    module: url_qr
    category: url_structure
    weight: 10
    title: Very long URL
    message: The link is very long, which is often used to hide the real address or tracking data.
  URL_SPECIAL_CHARS:
    module: url_qr
    category: url_structure
    weight: 5
    title: Many special characters
    message: The link contains an unusually high number of symbols, which can be used to confuse readers.
  URL_ENCODED_CHARS:
    module: url_qr
    category: url_structure
    weight: 10
    title: Heavily encoded characters
    message: Parts of the link are hidden using "%" encoding, a technique used to disguise words or destinations.
  URL_EMBEDDED_URL:
    module: url_qr
    category: url_structure
    weight: 10
    title: Contains another link inside it
    message: This link contains a second web address inside it, a pattern used to redirect you somewhere else.
  URL_BACKSLASH:
    module: url_qr
    category: url_structure
    weight: 5
    title: Uses backslashes in the address
    message: The address uses "\" characters, which browsers silently change to "/". This is sometimes used to disguise a link.
  URL_SHORTENER:
    module: url_qr
    category: url_structure
    weight: 10
    title: Uses a link shortener
    message: Shortened links hide the real destination until you open them.
  URL_SUSPICIOUS_TLD:
    module: url_qr
    category: url_structure
    weight: 10
    title: Uses a domain ending often abused by scammers
    message: The domain ending is frequently used for scam or malware sites. Many legitimate sites use it too, so this is only a weak signal.
  URL_MANY_HYPHENS:
    module: url_qr
    category: url_structure
    weight: 5
    title: Domain has many hyphens
    message: The domain name contains many hyphens, common in fake sites such as "secure-login-bank-update".
  URL_EXECUTABLE_DOWNLOAD:
    module: url_qr
    category: url_structure
    weight: 35
    scam_categories: [malicious_url]
    title: Downloads an app or program file
    message: This link points to an installable file (such as .apk or .exe). Installing apps from links can give scammers control of your phone or computer.
  URL_USER_CONTENT_HOST:
    module: url_qr
    category: url_structure
    weight: 8
    title: Hosted on a site where anyone can publish
    message: This page is hosted on a free platform where anyone can create pages, so the platform's name does not mean the page is genuine.
  URL_PUNYCODE:
    module: url_qr
    category: url_structure
    weight: 15
    scam_categories: [phishing]
    title: Uses international characters (punycode)
    message: The domain uses non-English characters (shown as "xn--" in its raw form). This can be genuine, but it is also used to create look-alike addresses.
  URL_MIXED_SCRIPT:
    module: url_qr
    category: url_structure
    weight: 25
    scam_categories: [phishing, impersonation]
    title: Mixes letters from different alphabets
    message: The domain mixes letters from different alphabets (for example Latin and Cyrillic) that look identical, a classic trick to imitate a real website.

  # ---- Lexical --------------------------------------------------------------------------------
  URL_PHISHING_KEYWORD:
    module: url_qr
    category: lexical
    weight: 5
    scam_categories: [phishing]
    title: Contains a word often used in phishing links
    message: The link contains words like "login", "verify" or "kyc" that scam sites use to look urgent or official.

  # ---- Brand / lookalike ----------------------------------------------------------------------
  OFFICIAL_DOMAIN_IN_SUBDOMAIN:
    module: url_qr
    category: brand
    weight: 40
    floor: 60
    scam_categories: [phishing, impersonation]
    title: Real brand address used as a disguise
    message: A genuine brand's web address appears at the start of this link, but the link actually belongs to a different domain.
  OFFICIAL_DOMAIN_IN_USERINFO:
    module: url_qr
    category: brand
    weight: 40
    floor: 60
    scam_categories: [phishing, impersonation]
    title: Real brand address placed before "@"
    message: A genuine brand's web address is placed before "@", but the browser would actually open a different site.
  BRAND_LOOKALIKE:
    module: url_qr
    category: brand
    weight: 40
    floor: 60
    scam_categories: [phishing, impersonation]
    title: Look-alike of a well-known brand's domain
    message: The domain imitates a well-known brand by swapping or changing characters, but it is not the brand's official website.
  BRAND_IN_SUBDOMAIN:
    module: url_qr
    category: brand
    weight: 25
    scam_categories: [phishing, impersonation]
    title: Brand name used on another website
    message: A well-known brand name appears in the address, but the site does not belong to that brand.
  BRAND_IN_DOMAIN_NAME:
    module: url_qr
    category: brand
    weight: 25
    scam_categories: [impersonation]
    title: Domain combines a brand name with other words
    message: The domain contains a well-known brand name combined with other words but is not one of the brand's official domains. This can be genuine (for example a partner site), so check carefully.
  BRAND_NAME_UNOFFICIAL_DOMAIN:
    module: url_qr
    category: brand
    weight: 20
    scam_categories: [impersonation]
    title: Brand name on an unrecognised domain ending
    message: The domain uses a well-known brand name with a domain ending that is not on our list of the brand's official websites.
  TRUSTED_DOMAIN:
    module: url_qr
    category: trust
    weight: -20
    title: Recognised domain
    message: The destination belongs to a domain on QRGUARD's list of recognised legitimate websites.

  # ---- Redirects ------------------------------------------------------------------------------
  REDIRECT_DANGEROUS_SCHEME:
    module: url_qr
    category: redirect
    weight: 60
    floor: 80
    scam_categories: [malicious_url]
    title: Redirects to code or an app link
    message: The link redirects to a "javascript:", "data:" or "intent:" address that could run code or open apps.
  REDIRECT_NON_WEB_SCHEME:
    module: url_qr
    category: redirect
    weight: 15
    title: Redirects out of the web browser
    message: The link redirects to a non-web address (for example a payment or app link). It was not followed further.
  REDIRECT_TO_PRIVATE_ADDRESS:
    module: url_qr
    category: redirect
    weight: 30
    scam_categories: [malicious_url]
    title: Redirects to a private or internal address
    message: The link redirects to a private, local or internal network address. QRGUARD blocked this request.
  REDIRECT_CHAIN_TOO_LONG:
    module: url_qr
    category: redirect
    weight: 15
    title: Too many redirects
    message: The link bounces through more redirects than QRGUARD allows, a pattern used to hide the final destination.
  REDIRECT_HTTPS_DOWNGRADE:
    module: url_qr
    category: redirect
    weight: 10
    title: Redirects from a secure to an insecure page
    message: The link starts on an encrypted (https) page but redirects to an unencrypted (http) one.
  REDIRECT_BLOCKED_PORT:
    module: url_qr
    category: redirect
    weight: 10
    title: Redirects to an unusual port
    message: The link redirects to an address with an unusual port number. QRGUARD did not follow it.
  REDIRECT_CROSS_DOMAIN:
    module: url_qr
    category: redirect
    weight: 0
    title: Leads to a different website
    message: The link redirects to a different website. That destination was analysed too.
  DOMAIN_NOT_RESOLVING:
    module: url_qr
    category: redirect
    weight: 5
    title: Domain could not be found
    message: The domain does not currently exist in DNS. It may be misspelled, new, or already taken down.
  REDIRECT_CHECK_INCOMPLETE:
    module: url_qr
    category: redirect
    weight: 0
    title: Could not check where the link leads
    message: QRGUARD could not safely finish checking where this link redirects (for example the server did not answer in time).

  # ---- Threat intelligence --------------------------------------------------------------------
  TI_LISTED:
    module: threat_intel
    category: reputation
    weight: 100
    floor: 90
    scam_categories: [malicious_url]
    title: Listed as malicious by a threat-intelligence source
    message: This link appears in a database of known malicious or phishing links.
  TI_PARTIAL:
    module: threat_intel
    category: reputation
    weight: 50
    scam_categories: [malicious_url]
    title: Flagged by some security vendors
    message: Some, but not all, security sources flag this link as harmful.

  # ---- Scam messages (module: message). Patterns live in app/data/scam_rules.yaml ----------
  # No single indicator is above 30 and no group cap above 40, so no single keyword or group
  # can make a message MALICIOUS (>= 60). The message module has no floors.
  MSG_SECURITY_ADVICE:
    module: message
    category: trust
    weight: -10
    title: Contains genuine security advice
    message: The message contains standard security advice such as "never share your OTP", which genuine banks and services include.
  MSG_UPI_PIN_TO_RECEIVE:
    module: message
    category: credential
    weight: 30
    scam_categories: [upi_scam]
    title: Asks for your UPI PIN (or a QR scan) to "receive" money
    message: You never need to enter your UPI PIN, approve a request or scan a QR code to RECEIVE money. These actions only send money from your account.
  MSG_OTP_REQUEST:
    module: message
    category: credential
    weight: 30
    scam_categories: [otp_scam, credential_theft]
    title: Asks you to share an OTP
    message: The message asks you to share a one-time password (OTP) or verification code. Anyone with your OTP can take over your account or approve payments.
  MSG_CREDENTIAL_REQUEST:
    module: message
    category: credential
    weight: 30
    scam_categories: [credential_theft]
    title: Asks for passwords, PINs or card details
    message: The message asks for a password, PIN, CVV, card number or login details. Genuine organisations never ask for these by message.
  MSG_REMOTE_ACCESS:
    module: message
    category: credential
    weight: 25
    scam_categories: [fake_customer_support, credential_theft]
    title: Asks you to install a screen-sharing or remote-control app
    message: Apps like AnyDesk or TeamViewer let a stranger see and control your phone, including your banking apps and OTPs.
  MSG_ACCOUNT_THREAT:
    module: message
    category: pressure
    weight: 15
    scam_categories: [kyc_account_suspension]
    title: Threatens to block or suspend your account
    message: The message threatens that an account, card, SIM or service will be blocked or suspended, a common way to rush people into acting without thinking.
  MSG_LEGAL_THREAT:
    module: message
    category: pressure
    weight: 15
    scam_categories: [impersonation]
    title: Threatens legal action, arrest or disconnection
    message: The message threatens police action, arrest, a court case or disconnection of a service. Scammers use fear to stop victims from checking.
  MSG_URGENCY:
    module: message
    category: pressure
    weight: 10
    title: Creates urgency
    message: The message pushes you to act immediately ("urgent", "within 24 hours", "last chance"), leaving no time to verify it.
  MSG_UPFRONT_FEE:
    module: message
    category: financial
    weight: 15
    title: Asks for a fee in advance
    message: The message asks for a registration, processing, release or similar fee before you receive something. Genuine prizes, jobs and refunds do not require this.
  MSG_PAYMENT_REQUEST:
    module: message
    category: financial
    weight: 15
    scam_categories: [banking_payment]
    title: Asks you to pay or transfer money
    message: The message asks you to pay or transfer money.
  MSG_KYC_PRETEXT:
    module: message
    category: pretext
    weight: 15
    scam_categories: [kyc_account_suspension]
    title: Uses a KYC / PAN / Aadhaar update as an excuse
    message: The message says your KYC, PAN or Aadhaar needs updating. This is one of the most common excuses used in banking scams.
  MSG_REFUND_PRETEXT:
    module: message
    category: pretext
    weight: 10
    scam_categories: [banking_payment]
    title: Mentions a refund or money sent by mistake
    message: The message talks about a refund or money credited by mistake, a common excuse to get you to "return" money or share details.
  MSG_UNREALISTIC_RETURNS:
    module: message
    category: lure
    weight: 20
    scam_categories: [investment]
    title: Promises unrealistic or guaranteed returns
    message: Guaranteed profits, "double your money" or daily percentage returns are classic signs of investment fraud.
  MSG_PRIZE_REWARD:
    module: message
    category: lure
    weight: 15
    scam_categories: [lottery_prize]
    title: Claims you have won a prize or reward
    message: The message claims you have won a prize, lottery or cashback. Unexpected winnings are a common scam lure.
  MSG_JOB_LURE:
    module: message
    category: lure
    weight: 15
    scam_categories: [fake_job]
    title: Offers easy work-from-home income
    message: The message offers easy part-time or work-from-home income, a common fake-job lure.
  MSG_TASK_EARNING:
    module: message
    category: lure
    weight: 15
    scam_categories: [fake_job]
    title: Pays you for simple online tasks
    message: Paying people to like videos, rate products or complete "tasks" is a well-known scam that later asks for deposits.
  MSG_INTERNSHIP_LURE:
    module: message
    category: lure
    weight: 15
    scam_categories: [fake_internship]
    title: Offers an internship, stipend or certificate
    message: The message offers an internship, stipend or certificate. This is only a concern when combined with fees or other warning signs.
  MSG_INVESTMENT_TOPIC:
    module: message
    category: lure
    weight: 5
    scam_categories: [investment]
    title: Mentions crypto, trading or investment groups
    message: The message is about crypto, trading tips or investment groups, topics often used in investment scams.
  MSG_OFF_PLATFORM_CONTACT:
    module: message
    category: contact
    weight: 5
    title: Moves the conversation to WhatsApp or Telegram
    message: The message asks you to continue on WhatsApp, Telegram or similar, where scammers are harder to trace.
  MSG_PHONE_CALL_TO_ACTION:
    module: message
    category: contact
    weight: 5
    title: Pushes you to call a phone number
    message: The message pressures you to call a number it provides. Always use the official number from the organisation's website or card.
  MSG_AUTHORITY_REFERENCE:
    module: message
    category: impersonation
    weight: 10
    scam_categories: [impersonation]
    title: Mentions police, government or an official agency
    message: The message mentions police, a court, customs, a government department or a courier company. Scammers often pretend to be these.
  MSG_SUPPORT_REFERENCE:
    module: message
    category: impersonation
    weight: 5
    scam_categories: [fake_customer_support]
    title: Mentions customer care or a support team
    message: The message refers to customer care, a helpline or a support executive.
  MSG_BANK_REFERENCE:
    module: message
    category: impersonation
    weight: 5
    scam_categories: [banking_payment]
    title: Mentions a bank, payment app or well-known brand
    message: The message mentions a bank, payment service or well-known company. Genuine messages do this too, so this only matters together with other warning signs.
  MSG_LINK_CALL_TO_ACTION:
    module: message
    category: link
    weight: 10
    scam_categories: [phishing]
    title: Asks you to act through a link
    message: The message asks you to click, update, verify or log in through a link. The link itself is analysed separately.
  MSG_EXCESSIVE_PUNCTUATION:
    module: message
    category: style
    weight: 5
    title: Excessive exclamation marks
    message: Many exclamation marks are typical of scam and spam messages.
  MSG_EXCESSIVE_CAPS:
    module: message
    category: style
    weight: 5
    title: Excessive capital letters
    message: A large share of the message is in CAPITAL letters, typical of attention-grabbing scam messages.
  MSG_HIDDEN_CHARACTERS:
    module: message
    category: style
    weight: 10
    title: Hidden or disguised characters
    message: The message contains invisible characters or words mixing different alphabets, techniques used to evade filters.
  MSG_LANGUAGE_NOT_SUPPORTED:
    module: message
    category: style
    weight: 0
    title: Language not fully supported
    message: Most of this message is not in English. QRGUARD's scam rules currently cover English only, so warning signs may be missed.

  # ---- Combination rules (module: message, shown as their own reasons) ------------------------
  MSG_COMBO_CREDENTIAL_IMPERSONATION:
    module: message
    category: combination
    weight: 20
    scam_categories: [credential_theft, impersonation]
    title: "Combination: asks for credentials while posing as an organisation"
    message: Asking for an OTP, PIN or password while claiming to be a bank, authority or support team is the classic account-takeover scam.
  MSG_COMBO_ADVANCE_FEE:
    module: message
    category: combination
    weight: 20
    title: "Combination: reward or job that requires paying first"
    message: A prize, job, task or internship that requires you to pay first is an advance-fee scam.
  MSG_COMBO_REWARD_CREDENTIAL:
    module: message
    category: combination
    weight: 20
    scam_categories: [credential_theft]
    title: "Combination: reward or refund that needs your OTP or PIN"
    message: A prize, cashback or refund that requires your OTP, PIN or password is a scam; receiving money never needs them.
  MSG_COMBO_THREAT_URGENCY_ACTION:
    module: message
    category: combination
    weight: 15
    scam_categories: [phishing]
    title: "Combination: threat + urgency + a link or number to act on"
    message: A threat, a deadline and a link or phone number to act on immediately is the typical structure of a phishing or scam message.
  MSG_COMBO_REMOTE_SUPPORT:
    module: message
    category: combination
    weight: 20
    scam_categories: [fake_customer_support]
    title: "Combination: support or refund + remote-access app"
    message: A "support" or "refund" contact asking you to install a remote-access app is a well-known fake customer-support scam.
  MSG_COMBO_RETURNS_PRIVATE_GROUP:
    module: message
    category: combination
    weight: 15
    scam_categories: [investment]
    title: "Combination: guaranteed returns in a private group"
    message: Guaranteed returns offered through WhatsApp or Telegram groups are a common investment-fraud pattern.

  # ---- OCR / screenshot (module: ocr). Informational only (weight 0): OCR itself never makes
  # anything suspicious; the extracted text is judged by the message rules above. -----------
  OCR_LOW_CONFIDENCE:
    module: ocr
    category: ocr_quality
    weight: 0
    title: Text was hard to read
    message: Parts of the screenshot were hard to read (blurry, small or stylised text), so some words may have been misread and warning signs may be missed.
  OCR_TEXT_TRUNCATED:
    module: ocr
    category: ocr_quality
    weight: 0
    title: Only part of the text was analysed
    message: The screenshot contained more text than QRGUARD analyses at once; only the first part was checked.

  # ---- QR payloads other than web links (module: url_qr). Web links in QR codes use the URL
  # indicators above; text in QR codes uses the message rules. -------------------------------
  QR_UPI_PAYMENT:
    module: url_qr
    category: qr_payload
    weight: 0
    title: This QR code makes a UPI payment
    message: Scanning this QR code and entering your UPI PIN SENDS money from your account. You never need to scan a QR code or enter your PIN to RECEIVE money.
  QR_UPI_MALFORMED:
    module: url_qr
    category: qr_payload
    weight: 15
    scam_categories: [upi_scam]
    title: Malformed UPI payment request
    message: The UPI payment details in this QR code are incomplete or invalid, which genuine payment QR codes from banks and apps do not produce.
  QR_UPI_PREFILLED_AMOUNT:
    module: url_qr
    category: qr_payload
    weight: 10
    title: Amount is already filled in
    message: The QR code already contains an amount to pay. That is normal for a bill you are paying, but not if someone claims they are sending you money.
  QR_UPI_NAME_MISMATCH:
    module: url_qr
    category: qr_payload
    weight: 15
    scam_categories: [upi_scam, impersonation]
    title: Payee name claims to be a bank or authority
    message: The payee name mentions a bank, brand or authority, but the UPI ID it pays to does not belong to them.
  QR_UPI_PRETEXT:
    module: url_qr
    category: qr_payload
    weight: 15
    scam_categories: [upi_scam]
    title: Payment note uses a scam excuse
    message: The payee name or payment note mentions a refund, prize, cashback, KYC or similar. Scammers use these to make a payment look like you are receiving money.
  QR_UPI_RECEIVE_CONTEXT:
    module: url_qr
    category: qr_payload
    weight: 30
    floor: 60
    scam_categories: [upi_scam]
    title: UPI payment QR presented as a way to receive money
    message: A UPI payment QR code is shown together with a promise of a refund, prize or money to receive. Scanning a UPI QR code only SENDS money, so this is a scam pattern.
  QR_WIFI_OPEN:
    module: url_qr
    category: qr_payload
    weight: 0
    title: Joins an open Wi-Fi network
    message: This QR code connects to a Wi-Fi network without a password. Others on an open network may be able to see unencrypted traffic.
  QR_WIFI_WEAK_SECURITY:
    module: url_qr
    category: qr_payload
    weight: 5
    title: Wi-Fi uses outdated WEP security
    message: This Wi-Fi network uses WEP, an outdated and easily broken security method.
  QR_PHONE_NUMBER:
    module: url_qr
    category: qr_payload
    weight: 0
    title: Calls or messages a phone number
    message: This QR code starts a call or message to a phone number. Check the number is genuine before calling.
  QR_SMS_PREFILLED:
    module: url_qr
    category: qr_payload
    weight: 10
    title: Sends a pre-written SMS
    message: This QR code prepares an SMS with text already filled in. Sending messages to unknown numbers can subscribe you to paid services or confirm you are a target.
  QR_EMAIL:
    module: url_qr
    category: qr_payload
    weight: 0
    title: Writes an e-mail
    message: This QR code prepares an e-mail to an address.
  QR_GEO_LOCATION:
    module: url_qr
    category: qr_payload
    weight: 0
    title: Shows a map location
    message: This QR code contains map coordinates.
  QR_APP_LINK:
    module: url_qr
    category: qr_payload
    weight: 10
    title: Opens an app directly
    message: This QR code opens an app directly instead of a web page. Make sure you trust the source before allowing it.
