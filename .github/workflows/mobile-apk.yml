name: mobile-apk

# Builds an installable Android APK of the QRGUARD app on GitHub's runners, without an Expo
# account: `expo prebuild` generates the native project and Gradle builds it. The APK is signed
# with the template's debug key, which is fine for installing on phones (demo, testing) but not
# for the Play Store (that needs EAS or an upload key; docs/deployment.md §4).
#
# Run it from the Actions tab ("mobile-apk" → "Run workflow"), or it runs when the app changes on
# main. Download the APK from the run's "Artifacts" section.
#
# Settings (repository → Settings → Secrets and variables → Actions → Variables). All are public
# app configuration, never secrets:
#   QRGUARD_API_BASE_URL           https backend URL (default: the Render service below)
#   EXPO_PUBLIC_FIREBASE_API_KEY, EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN,
#   EXPO_PUBLIC_FIREBASE_PROJECT_ID, EXPO_PUBLIC_FIREBASE_APP_ID
#                                  optional; without them sign-in is off and every check still works

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/mobile-apk.yml"]
  pull_request:
    paths: [".github/workflows/mobile-apk.yml"]

concurrency:
  group: mobile-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # only used by the release step (not on pull requests)
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_PUBLIC_API_BASE_URL: ${{ vars.QRGUARD_API_BASE_URL || 'https://qrguard-api-pc00.onrender.com' }}
      EXPO_PUBLIC_FIREBASE_API_KEY: ${{ vars.EXPO_PUBLIC_FIREBASE_API_KEY }}
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
      EXPO_PUBLIC_FIREBASE_APP_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_APP_ID }}
      # Same guard as an EAS release build: refuse a non-https backend (see app.config.ts).
      EAS_BUILD_PROFILE: preview
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install --clean
      - name: Check permissions (camera granted for QR scanning, nothing extra)
        run: |
          manifest=android/app/src/main/AndroidManifest.xml
          grep -E 'android.permission.CAMERA"' "$manifest" | grep -vq 'tools:node="remove"' ||
            { echo "::error::CAMERA permission missing or removed: QR scanning would not work"; exit 1; }
          for p in RECORD_AUDIO READ_EXTERNAL_STORAGE WRITE_EXTERNAL_STORAGE READ_MEDIA_IMAGES; do
            grep -E "android.permission.$p\"" "$manifest" | grep -q 'tools:node="remove"' ||
              { echo "::error::$p must stay blocked"; exit 1; }
          done
      - name: Build the release APK (64-bit ARM phones)
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a
      - name: Name the APK
        id: apk
        run: |
          name="QRGUARD-${GITHUB_SHA::7}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Built $name ($(du -h "$name" | cut -f1)) for $EXPO_PUBLIC_API_BASE_URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify the APK (permissions and backend address)
        run: |
          apk="${{ steps.apk.outputs.name }}"
          aapt=$(ls "$ANDROID_HOME"/build-tools/*/aapt | sort -V | tail -1)
          perms=$("$aapt" dump permissions "$apk")
          echo "$perms"
          echo "$perms" | grep -q "android.permission.CAMERA" || { echo "::error::APK has no CAMERA permission"; exit 1; }
          for p in RECORD_AUDIO READ_EXTERNAL_STORAGE WRITE_EXTERNAL_STORAGE READ_MEDIA_IMAGES; do
            ! echo "$perms" | grep -q "android.permission.$p'" || { echo "::error::APK requests $p"; exit 1; }
          done
          unzip -p "$apk" assets/index.android.bundle | grep -qF "$EXPO_PUBLIC_API_BASE_URL" ||
            { echo "::error::the app bundle does not contain $EXPO_PUBLIC_API_BASE_URL"; exit 1; }
          echo "Verified: CAMERA granted, no microphone/storage, backend $EXPO_PUBLIC_API_BASE_URL" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: mobile/${{ steps.apk.outputs.name }}
          retention-days: 30
          if-no-files-found: error
      # A public download link that needs no GitHub login (for installing on phones). Only from
      # main or a manual run, never from pull requests.
      - name: Publish to the "android-latest" release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="${{ steps.apk.outputs.name }}"
          cp "$apk" QRGUARD.apk
          notes="Android APK built from ${GITHUB_SHA::7} for $EXPO_PUBLIC_API_BASE_URL. Install on the phone (allow \"Install unknown apps\"). Debug-key signed: not for the Play Store."
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest QRGUARD.apk --clobber
            gh release edit android-latest --notes "$notes" --target "$GITHUB_SHA"
          else
            gh release create android-latest QRGUARD.apk --prerelease --title "QRGUARD Android (latest)" --notes "$notes" --target "$GITHUB_SHA"
          fi
          echo "Download: https://github.com/${GITHUB_REPOSITORY}/releases/download/android-latest/QRGUARD.apk" >> "$GITHUB_STEP_SUMMARY"
