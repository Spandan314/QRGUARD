name: e2e

# Whole-system browser tests: web app and mobile app (Expo web export) -> Firebase Auth emulator ->
# Flask backend -> analysis / threat intelligence / scoring -> Firestore emulator. No secrets needed:
# the "demo-qrguard" project exists only inside the emulators.
on:
  pull_request:
    paths:
      - "backend/**"
      - "web/**"
      - "mobile/**"
      - "firebase/**"
      - "e2e/**"
      - ".github/workflows/e2e.yml"
  push:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pip install -r backend/requirements-dev.txt
      - name: Install JavaScript dependencies
        run: |
          for dir in web mobile firebase e2e; do (cd "$dir" && npm ci --no-audit --no-fund); done
      - name: Run end-to-end tests
        env:
          PYTHON: python
        run: CHROMIUM_PATH="$(command -v google-chrome)" bash e2e/run.sh
      - name: Keep screenshots and the backend log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: e2e/artifacts
          retention-days: 7
